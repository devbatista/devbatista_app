<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Admin DevBatista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .auth-foot { margin-top: 20px; text-align: center; }
  .pw { position: relative; }
  .pw .input { padding-right: 44px; }
  .pw .icon-btn { position: absolute; right: 2px; top: 0; }
</style>
</head>
<body>
<main class="auth">
  <div style="width:min(420px,100%)">
    <div class="card auth-card">
      <div class="row" style="justify-content:space-between">
        <img class="logo" src="../assets/logo-devbatista-branco.png" alt="DevBatista">
        <span class="badge b-info">Admin</span>
      </div>
      <div class="stack" style="gap:6px">
        <h1 style="font-size:24px">Entrar</h1>
        <p class="lead">Acesso restrito à equipe da DevBatista.</p>
      </div>

      <form class="form" id="login" action="../dashboard/dashboard.html" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input class="input" id="email" type="email" autocomplete="username" placeholder="voce@devbatista.com" required>
        </div>
        <div class="field">
          <div class="row" style="justify-content:space-between">
            <label for="senha">Senha</label>
            <a href="recuperar-senha.html" style="font-size:13px;font-weight:600">Esqueci minha senha</a>
          </div>
          <div class="pw">
            <input class="input" id="senha" type="password" autocomplete="current-password" required style="width:100%">
            <button class="icon-btn ghost" type="button" id="ver-senha" aria-label="Mostrar senha" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/></svg></button>
          </div>
        </div>
        <button class="btn pri block" type="submit">Entrar</button>
      </form>

      <p class="caption" style="margin:0;display:flex;gap:8px;align-items:flex-start">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M5 11h14v10H5zM8 11V7a4 4 0 018 0v4"/></svg>
        <span>Por segurança, a conta é bloqueada por 15 minutos após 5 tentativas de login inválidas seguidas. Todos os acessos ficam registrados na auditoria.</span>
      </p>
    </div>
    <p class="caption auth-foot">© 2026 DevBatista · conexão segura</p>
  </div>
</main>
<script>
  // Comportamento local: mostrar senha e seguir para o dashboard no protótipo
  (function () {
    var b = document.getElementById('ver-senha');
    var s = document.getElementById('senha');
    b.addEventListener('click', function () {
      var show = s.type === 'password';
      s.type = show ? 'text' : 'password';
      b.setAttribute('aria-pressed', show);
      b.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    });
    document.getElementById('login').addEventListener('submit', function (e) {
      e.preventDefault();
      window.location.href = '../dashboard/dashboard.html';
    });
  })();
</script>
</body>
</html>
