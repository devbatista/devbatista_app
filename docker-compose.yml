# Ambiente de desenvolvimento: app, Sidekiq, PostgreSQL e Redis.
#   docker compose up            sobe tudo em http://localhost:3847 (banco exposto na 5847)
#   docker compose run --rm web bin/rails db:seed
#   docker compose run --rm -e RAILS_ENV=test web bundle exec rspec
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_URL: redis://redis:6379/0
    APP_HOST: localhost
    APP_PORT: ${APP_PORT:-3847}
  env_file:
    - path: .env
      required: false
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  tty: true
  stdin_open: true

services:
  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "${APP_PORT:-3847}:3000"

  sidekiq:
    <<: *app
    command: bundle exec sidekiq

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_HOST:-5847}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bundle:
  postgres:
  redis:
