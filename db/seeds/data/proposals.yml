  description: |-
    Portal web para que os revendedores da Empresa XYZ façam pedidos diretamente, sem depender de WhatsApp e planilhas.

    Escopo:
    • Catálogo com preços por tabela de revendedor e disponibilidade de estoque em tempo real.
    • Carrinho, envio de pedido e acompanhamento de status (recebido, separado, faturado, entregue).
    • Painel do cliente com histórico de pedidos e 2ª via de boletos.
    • Integração com o Sistema ERP já em produção (pedidos, estoque e faturamento).
    • Painel administrativo para a equipe comercial da XYZ.

    Fora do escopo: aplicativo mobile nativo e integração com transportadoras.
