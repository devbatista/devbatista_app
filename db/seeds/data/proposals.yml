#   default_price dos itens. Criada em 15/09/2026; valor ajustado de 14.500 para 14.000 em 16/09.
#   Enviada para Marina Costa (marina.costa@xyz.com.br), que não existe em contacts.yml:
#   contact fica null (atenção: o model sugere o contato principal, Fernanda Lopes).
# - Demais propostas só mostram serviço e valor: um item por serviço, default_price = preço do
#   catálogo, recurrence one_off (valores de projeto). Gestão de infraestrutura (#030 e #022)
#   também foi tratada como one_off, embora o serviço seja recorrente no catálogo.
# - #P-2026-032 (rascunho): o design só mostra o total (R$ 12.000) e os serviços; a divisão
#   8.500 + 3.500 é premissa. valid_until (obrigatório) não aparece: usado 02/10/2026
#   (padrão de 15 dias a partir de 17/09). O contrato #110 (draft, Grupo Norte) não foi
#   ligado porque a proposta ainda é rascunho.
# - #P-2026-024 e #P-2026-022: validade não aparece; usado envio + 15 dias.
