# Extraído de docs/design/operacao/projetos.html (lista: 8 projetos) e operacao/projeto.html
# (detalhe do "Portal ACME — Fase 2"). Conferido com operacao/tarefas.html, operacao/horas.html,
# clientes/empresa.html e geral/notificacoes.html.
#
# Observações:
# - progress_from_tasks: só o Portal ACME — Fase 2 mostra "Calculado pelas tarefas" (13 de 21
#   concluídas = 62%). Os demais usam o percentual do design, informado à mão.
# - hours: total de horas da coluna "Horas" do design. O seed completa com lançamentos o que
#   as tarefas e os lançamentos de time_entries.yml não cobrem (ver db/seeds/operacao.rb).
# - A estimativa do projeto é a soma das estimativas das tarefas. Bate com o design no Portal
#   ACME (160 h), no ERP Cliente C (280 h) e no Painel de indicadores (64 h). Nos demais o
#   design só mostra o total, sem tarefas que o expliquem: a estimativa fica menor que a do
#   design (Automação de NF Delta: 10 h em vez de 56 h) ou vazia.
# - clientes/empresa.html mostra outra versão do Portal ACME — Fase 2 (início 01/07, previsão
#   30/11, R$ 36.000, 186 h). Vale a de projetos.html e projeto.html.
# - Portal ACME — Fase 2: "vendido na proposta aprovada", mas essa proposta não está em
#   proposals.yml (ver observação lá): proposal fica null.
# - Descrições dos projetos (exceto Portal ACME) e de Site/Chatbot/App Orion são resumos
#   escritos para o seed a partir das linhas da lista.

