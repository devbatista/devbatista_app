# Extraído de docs/design/operacao/chamados.html (lista: 12 chamados) e operacao/chamado.html
# (detalhe do #2394: contato, mensagens e horários do fluxo). O #2342 vem da aba Chamados de
# clientes/empresa.html.
#
# Observações:
# - clientes/empresa.html usa os números #2397 e #2389 para outros chamados da ACME e mostra
#   o #2381 com Carla Mendes e prioridade Alta. Valem os dados de chamados.html.
# - description: o design só mostra o assunto e, às vezes, uma linha de contexto. O texto da
#   abertura foi escrito para o seed a partir dessa linha. No #2394 é a primeira mensagem do
#   cliente mostrada em chamado.html.
# - contact: só o #2394 (Marcos Teixeira) e os da ACME com "Aberto por" no design têm contato
#   definido; nos demais o model sugere o contato principal da empresa.
# - resolved_at do #2392, #2389 e #2342 não aparece no design: premissa no dia seguinte ou
#   poucas horas depois da abertura.
# - steps: horários em que o chamado entrou em cada status (chamado.html). O seed grava esses
#   eventos na auditoria para o fluxo de atendimento mostrar os horários do design.

- number: 2394
  company: Empresa Delta
  contact: Marcos Teixeira
  subject: Sistema fora do ar
  category: infrastructure
  priority: critical
  status: in_progress
  user: carla.mendes@devbatista.com.br
  opened_at: "2026-09-17T08:47:00-03:00"
  description: >-
    Desde as 08:30 a API está retornando erro 502 e o aplicativo de pedidos dos representantes
    parou. Os vendedores estão em campo e não conseguem lançar pedidos. Precisamos de
    prioridade máxima.
  steps:
    analyzing: "2026-09-17T08:55:00-03:00"
    in_progress: "2026-09-17T09:20:00-03:00"
  messages:
    - { at: "2026-09-17T08:55:00-03:00", kind: reply, user: carla.mendes@devbatista.com.br, body: "Marcos, recebido. Classificamos o chamado como crítico e o Diego já está verificando o servidor da API na AWS. Retorno em até 30 minutos com o diagnóstico." }
    - { at: "2026-09-17T09:20:00-03:00", kind: note, user: diego.rocha@devbatista.com.br, body: "Instância da API Delta com disco 100% ocupado por logs de acesso sem rotação. Liberei espaço, configurei a rotação diária e reiniciei o serviço. Credenciais de acesso usadas conforme referência no cofre de senhas. Sigo monitorando." }
    - { at: "2026-09-17T09:41:00-03:00", kind: reply, user: carla.mendes@devbatista.com.br, body: "A API voltou a responder às 09:34. Pode confirmar se o aplicativo de pedidos já está normal aí?" }
    - { at: "2026-09-17T09:58:00-03:00", kind: client, user: carla.mendes@devbatista.com.br, contact: Marcos Teixeira, channel: E-mail, body: "Confirmado, voltou. Mas os pedidos enviados entre 08:30 e 09:30 não aparecem no sistema." }
    - { at: "2026-09-17T10:06:00-03:00", kind: reply, user: carla.mendes@devbatista.com.br, body: "Abrimos o chamado #2395 para tratar a sincronização desses pedidos. Mantemos este em atendimento até confirmarmos a estabilidade e ativarmos o alerta de disco no servidor." }

