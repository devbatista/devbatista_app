# Catálogo dos robôs e agentes de IA (docs/specs/visitas-do-site, seção Acessos de IA).
# Lido pelo AiAgentClassifier. A lista muda com frequência: revise a cada poucos meses.
#
# agents: um por user agent declarado. `pattern` é procurado no User-Agent como palavra inteira,
#   sem diferenciar maiúsculas. `kind`: training (treino), search (busca com IA), user (a pedido
#   de alguém). `ip_ranges_url`: JSON oficial no formato { prefixes: [{ ipv4Prefix | ipv6Prefix }] };
#   sem ele, o acesso fica como "declarado".
# signature_agents: domínios que assinam as requisições (Web Bot Auth, header Signature-Agent).
# assistants: de onde vêm as pessoas que clicam num link dentro de um assistente de IA (canal
#   Assistentes de IA), pela referência ou pelo utm_source.

agents:
