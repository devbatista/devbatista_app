# Rotinas diárias (sidekiq-cron), no horário de Brasília.
# Cada módulo acrescenta as suas verificações em DailyAlertsJob.
alertas_diarios:
  cron: "0 7 * * * America/Sao_Paulo"
  class: "DailyAlertsJob"
  description: "Vencimentos e alertas da central de notificações"

cobrancas:
  cron: "30 5 * * * America/Sao_Paulo"
  class: "BillingSyncJob"
  description: "Puxa as faturas da AWS, da Cloudflare e do Railway para Despesas"

sal_das_visitas:
  cron: "10 0 * * * America/Sao_Paulo"
  class: "SiteVisitSaltCleanupJob"
  description: "Apaga o sal do hash dos visitantes dos dias anteriores (visitas do site)"

faixas_ip_ia:
  cron: "0 4 * * * America/Sao_Paulo"
  class: "AiAgentIpRangesJob"
  description: "Baixa as faixas de IP oficiais dos robôs de IA (acessos de IA do site)"

recorrencias:
  cron: "0 6 * * * America/Sao_Paulo"
  class: "RecurrenceJob"
  description: "Gera os títulos recorrentes, marca vencidos e atualiza o câmbio das despesas"
