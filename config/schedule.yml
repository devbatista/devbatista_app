# Rotinas diárias (sidekiq-cron), no horário de Brasília.
# Cada módulo acrescenta as suas verificações em DailyAlertsJob.
alertas_diarios:
  cron: "0 7 * * * America/Sao_Paulo"
  class: "DailyAlertsJob"
  description: "Vencimentos e alertas da central de notificações"

recorrencias:
  cron: "0 6 * * * America/Sao_Paulo"
  class: "RecurrenceJob"
  description: "Gera os títulos recorrentes, marca vencidos e atualiza o câmbio das despesas"
